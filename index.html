<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Som Dubey | Data Analytics & Data Engineering Portfolio</title>

    <meta name="description"
        content="Portfolio of Som Dubey - Data Analyst & Aspiring Data Engineer specializing in Python, SQL, Power BI, ETL Pipelines and Business Intelligence.">

    <!-- Google Fonts -->

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Sora:wght@500;600;700;800&display=swap"
        rel="stylesheet">

    <!-- Font Awesome -->

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

<style>

/* =====================================================
        ROOT VARIABLES
===================================================== */

:root{

--bg:#020617;

--card:rgba(15,23,42,.75);

--card-solid:#0f172a;

--primary:#3b82f6;

--secondary:#8b5cf6;

--text:#f8fafc;

--gray:#94a3b8;

--border:rgba(255,255,255,.08);

--shadow:0 15px 40px rgba(0,0,0,.4);

}

/* =====================================================
RESET
===================================================== */

*{

margin:0;

padding:0;

box-sizing:border-box;

scroll-behavior:smooth;

}

body{

background:var(--bg);

font-family:'Inter',sans-serif;

color:var(--text);

overflow-x:hidden;

}

/* Scrollbar */

::-webkit-scrollbar{

width:10px;

}

::-webkit-scrollbar-thumb{

background:linear-gradient(var(--primary),var(--secondary));

border-radius:30px;

}

/* =====================================================
BACKGROUND
===================================================== */

body::before{

content:"";

position:fixed;

width:700px;

height:700px;

background:#3b82f620;

filter:blur(150px);

top:-300px;

right:-250px;

z-index:-2;

}

body::after{

content:"";

position:fixed;

width:600px;

height:600px;

background:#8b5cf620;

filter:blur(160px);

bottom:-250px;

left:-250px;

z-index:-2;

}

/* =====================================================
CONTAINER
===================================================== */

.container{

width:min(1200px,90%);

margin:auto;

}

/* =====================================================
HEADER
===================================================== */

header{

position:fixed;

top:0;

left:0;

width:100%;

z-index:1000;

backdrop-filter:blur(16px);

background:rgba(2,6,23,.55);

border-bottom:1px solid var(--border);

}

nav{

display:flex;

justify-content:space-between;

align-items:center;

height:80px;

}

/* =====================================================
LOGO
===================================================== */

.logo{

font-family:'Sora',sans-serif;

font-size:1.4rem;

font-weight:700;

display:flex;

align-items:center;

gap:12px;

}

.logo-box{

width:45px;

height:45px;

border-radius:12px;

background:linear-gradient(135deg,var(--primary),var(--secondary));

display:flex;

justify-content:center;

align-items:center;

font-weight:700;

}

/* =====================================================
NAVIGATION
===================================================== */

.nav-links{

display:flex;

list-style:none;

gap:35px;

}

.nav-links a{

text-decoration:none;

color:var(--gray);

font-weight:500;

transition:.3s;

position:relative;

}

.nav-links a:hover{

color:white;

}

.nav-links a::after{

content:"";

position:absolute;

left:0;

bottom:-6px;

width:0;

height:2px;

background:linear-gradient(to right,var(--primary),var(--secondary));

transition:.3s;

}

.nav-links a:hover::after{

width:100%;

}

/* =====================================================
BUTTON
===================================================== */

.resume-btn{

padding:12px 24px;

border-radius:50px;

background:linear-gradient(135deg,var(--primary),var(--secondary));

text-decoration:none;

color:white;

font-weight:600;

transition:.3s;

box-shadow:0 10px 25px rgba(59,130,246,.25);

}

.resume-btn:hover{

transform:translateY(-3px);

}

/* =====================================================
MOBILE MENU
===================================================== */

.menu{

display:none;

font-size:1.6rem;

cursor:pointer;

}

/* =====================================================
PLACEHOLDER SECTION
===================================================== */

section{

padding:120px 0;

min-height:100vh;

display:flex;

align-items:center;

justify-content:center;

}

/* =====================================================
RESPONSIVE
===================================================== */

@media(max-width:900px){

.nav-links{

display:none;

}

.resume-btn{

display:none;

}

.menu{

display:block;

}

}

</style>

</head>

<body>

<!-- ===================================================
NAVBAR
=================================================== -->

<header>

<div class="container">

<nav>

<div class="logo">

<div class="logo-box">

SD

</div>

Som Dubey

</div>

<ul class="nav-links">

<li><a href="#home">Home</a></li>

<li><a href="#about">About</a></li>

<li><a href="#skills">Skills</a></li>

<li><a href="#projects">Projects</a></li>

<li><a href="#contact">Contact</a></li>

</ul>

<a href="#" class="resume-btn">

<i class="fa-solid fa-download"></i>

Resume

</a>

<div class="menu">

<i class="fa-solid fa-bars"></i>

</div>

</nav>

</div>

</header>

<!-- ===================================================
HOME PLACEHOLDER
=================================================== -->

<section id="home">

<div class="container">

<h1 style="font-family:Sora;font-size:3rem;text-align:center;">
Portfolio Coming Soon...
</h1>

</div>

</section>

</body>

</html>
